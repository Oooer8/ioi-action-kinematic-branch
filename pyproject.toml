[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ioi-action-kinematic-branch"
version = "0.2.0"
description = "Raw-action branch and geometry/action AdaLN ablations on frozen Wan2.1 1.3B"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
dependencies = ["torch>=2.5,<3", "numpy>=1.24", "safetensors>=0.4.5", "diffusers>=0.32,<0.43"]

[project.optional-dependencies]
test = ["pytest>=8", "ruff>=0.9"]
video = ["imageio[ffmpeg]>=2.35", "Pillow>=10"]

[project.scripts]
ioi-train = "ioi_action_branch.train:main"
ioi-sample = "ioi_action_branch.sample:main"
ioi-smoke = "ioi_action_branch.smoke:main"
ioi-prepare = "ioi_action_branch.prepare:main"
ioi-inspect = "ioi_action_branch.inspect:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore:.*torch.cuda.amp.autocast.*:FutureWarning", "ignore:User provided device_type of 'cuda'.*:UserWarning"]

[tool.ruff]
line-length = 100
exclude = ["src/ioi_action_branch/_vendor/wan_model.py"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
